spring:
  application:
    name: stream-producer

  kafka:
    bootstrap-servers: kafka:9092

openaq:
  base-url: https://api.openaq.org/v3/
  sensor-data-fetch-interval-ms: 60000 # 1m
  station-data-fetch-interval-ms: 3600000 # 1h
  api-key: ${OPENAQ_API_KEY}

custom:
  kafka:
    topics:
      sensor-measurements: air-quality.sensor-measurements
      measuring-stations: air-quality.measuring-stations
    schema-registry: http://schema-registry:8081